name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Syntax check
        run: python -m py_compile capture_pdf.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name CapturePDF capture_pdf.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CapturePDF
          path: dist/CapturePDF.exe
